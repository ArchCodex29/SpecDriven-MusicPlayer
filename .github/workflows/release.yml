name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      matches: ${{ steps.check.outputs.matches }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check tag against package version
        id: check
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            && [[ "$RELEASE_TAG" == "v$version" ]]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $RELEASE_TAG does not match package version $version; skipping release."
          fi

  build:
    needs: check-tag
    if: needs.check-tag.outputs.matches == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.check-tag.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-tag.outputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build static app
        run: npm run build

      - name: Check static hosting paths
        run: npm run check:static

      - name: Package static app
        run: |
          asset_name="small-music-player-${RELEASE_TAG}.zip"
          (cd dist && zip -qr "$GITHUB_WORKSPACE/$asset_name" .)
          unzip -t "$asset_name"
          mkdir "$RUNNER_TEMP/release-zip"
          unzip -q "$asset_name" -d "$RUNNER_TEMP/release-zip"
          test -f "$RUNNER_TEMP/release-zip/index.html"
          node scripts/check-static-output.mjs "$RUNNER_TEMP/release-zip"

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: static-client-zip
          path: small-music-player-*.zip
          if-no-files-found: error

  publish:
    needs: [check-tag, build]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.check-tag.outputs.release_tag }}
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-tag.outputs.release_tag }}

      - name: Download release ZIP
        uses: actions/download-artifact@v4
        with:
          name: static-client-zip
          path: release

      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release/*.zip --verify-tag --title "$RELEASE_TAG" --generate-notes
